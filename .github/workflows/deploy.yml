name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; never cancel a deploy halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with `nix develop` (zola --version)
  ZOLA_VERSION: "0.21.0"
  ZOLA_SHA256: "5c37a8f706567d6cad3f0dbc0eaebe3b9591cc301bd67089e5ddc0d0401732d6"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Zola
        run: |
          curl -sSfL -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf zola.tar.gz -C "$RUNNER_TEMP/bin" zola
          rm zola.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build
        run: zola build

      # Pull requests stop here: tested and built, not deployed.
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy
